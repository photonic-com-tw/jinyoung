<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>預約資料填寫｜金永國際租賃有限公司</title>
        {{> head-fonts }}
    </head>
    <body>
        {{> header }}

        <main class="booking-details">
            <section class="booking-details-hero">
                <div class="container booking-details-hero-inner">
                    <h1 class="booking-details-hero-title">我要預約</h1>
                    <p class="booking-details-hero-subtitle">
                        免去排行程的燒腦，定版行程一鍵預約。
                    </p>
                </div>
            </section>

            <section class="rental-breadcrumb">
                <div class="container">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <ol class="breadcrumb-list">
                            <li><a href="/pages/index.html">首頁</a></li>
                            <li aria-current="page">我要預約</li>
                        </ol>
                    </nav>
                </div>
            </section>

            <section class="booking-details-body">
                <div class="container booking-details-body-inner">
                    <div class="booking-details-header">
                        <div class="booking-details-heading">
                            <h2 class="booking-details-title">我要預約</h2>
                            <p class="booking-details-subtitle">
                                請選擇服務、填寫資訊，確認行程與費用後完成結帳。
                            </p>
                        </div>
                        <div class="booking-details-actions">
                            <a href="#" class="btn-back">
                                <img
                                    src="../assets/images/icon-arrow-left.svg"
                                    alt=""
                                    width="18"
                                    height="18"
                                />
                                返回上一頁
                            </a>
                        </div>
                    </div>

                    <div class="booking-details-layout">
                        <div class="booking-details-main">
                            <div class="booking-details-cart-list">
                                <div class="booking-details-cart-item">
                                    <div class="booking-details-cart-top">
                                        <span
                                            class="booking-details-service-chip"
                                        >
                                            <img
                                                src="../assets/images/icon-car.svg"
                                                alt=""
                                                width="16"
                                                height="16"
                                            />
                                            推薦行程
                                        </span>
                                        <a
                                            href="/pages/booking-entry.html"
                                            class="booking-details-cart-title"
                                        >
                                            苗栗市旅遊
                                            <img
                                                src="../assets/images/icon-box-arrow-up-right.svg"
                                                alt=""
                                                width="16"
                                                height="16"
                                            />
                                        </a>
                                        <a
                                            href="#"
                                            class="booking-details-cart-remove"
                                        >
                                            <img
                                                src="../assets/images/icon-trash.svg"
                                                alt=""
                                                width="18"
                                                height="18"
                                            />
                                            刪除
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <form
                                id="booking-details-form"
                                class="booking-details-form"
                                action="#"
                                method="post"
                            >
                                <div class="booking-details-form-grid">
                                    <div class="booking-details-field">
                                        <label for="tenant-name">
                                            <span class="required">*</span
                                            >承租人姓名
                                        </label>
                                        <input
                                            type="text"
                                            id="tenant-name"
                                            name="tenant-name"
                                            placeholder="請輸入姓名"
                                            required
                                            autocomplete="name"
                                        />
                                    </div>

                                    <div class="booking-details-field">
                                        <label for="tenant-phone">
                                            <span class="required">*</span
                                            >聯絡電話
                                        </label>
                                        <input
                                            type="tel"
                                            id="tenant-phone"
                                            name="tenant-phone"
                                            placeholder="請輸入電話"
                                            required
                                            autocomplete="tel"
                                        />
                                    </div>

                                    <div class="booking-details-field">
                                        <label for="tenant-email">
                                            <span class="required">*</span>Email
                                        </label>
                                        <input
                                            type="email"
                                            id="tenant-email"
                                            name="tenant-email"
                                            placeholder="請輸入Email"
                                            required
                                            autocomplete="email"
                                        />
                                    </div>

                                    <div class="booking-details-field-group">
                                        <div class="booking-details-field">
                                            <label for="pax-adult">人數</label>
                                            <input
                                                type="number"
                                                id="pax-adult"
                                                name="pax-adult"
                                                min="0"
                                                placeholder="大人"
                                            />
                                        </div>
                                        <div class="booking-details-field">
                                            <label
                                                for="pax-child"
                                                class="sr-only"
                                                >人數（小孩）</label
                                            >
                                            <input
                                                type="number"
                                                id="pax-child"
                                                name="pax-child"
                                                min="0"
                                                placeholder="小孩"
                                            />
                                        </div>
                                    </div>

                                    <!-- Recommended Trip: single departure date -->
                                    <div
                                        class="booking-details-field booking-details-field--wide"
                                        data-booking-source="recommended"
                                    >
                                        <label for="trip-date"
                                            >預計出發日期</label
                                        >
                                        <input
                                            type="date"
                                            id="trip-date"
                                            name="trip-date"
                                        />
                                    </div>

                                    <!-- Airport Transfer / Long-term Care Transfer: departure date + time -->
                                    <div
                                        class="booking-details-field-group"
                                        data-booking-source="airport longcare"
                                    >
                                        <div class="booking-details-field">
                                            <label for="pickup-date"
                                                >出發日期</label
                                            >
                                            <input
                                                type="date"
                                                id="pickup-date"
                                                name="pickup-date"
                                            />
                                        </div>
                                        <div class="booking-details-field">
                                            <label for="pickup-time"
                                                >出發時間</label
                                            >
                                            <input
                                                type="time"
                                                id="pickup-time"
                                                name="pickup-time"
                                            />
                                        </div>
                                    </div>

                                    <!-- Charter Service / Self-drive Rental: rental start/end date range -->
                                    <div
                                        class="booking-details-field-group"
                                        data-booking-source="charter self-drive"
                                    >
                                        <div class="booking-details-field">
                                            <label for="rental-start-date"
                                                >開始承租日</label
                                            >
                                            <input
                                                type="date"
                                                id="rental-start-date"
                                                name="rental-start-date"
                                            />
                                        </div>
                                        <div class="booking-details-field">
                                            <label for="rental-end-date"
                                                >結束承租日</label
                                            >
                                            <input
                                                type="date"
                                                id="rental-end-date"
                                                name="rental-end-date"
                                            />
                                        </div>
                                    </div>

                                    <!-- Airport Transfer / Long-term Care Transfer / Charter Service: pickup address -->
                                    <div
                                        class="booking-details-field-group booking-details-field-group--address"
                                        data-booking-source="airport longcare charter"
                                    >
                                        <div class="booking-details-field">
                                            <label for="origin-city"
                                                >出發地</label
                                            >
                                            <select
                                                id="origin-city"
                                                name="origin-city"
                                            >
                                                <option
                                                    value=""
                                                    selected
                                                    disabled
                                                >
                                                    縣市
                                                </option>
                                            </select>
                                        </div>
                                        <div class="booking-details-field">
                                            <label
                                                for="origin-district"
                                                class="sr-only"
                                                >出發地（鄉鎮區）</label
                                            >
                                            <select
                                                id="origin-district"
                                                name="origin-district"
                                            >
                                                <option
                                                    value=""
                                                    selected
                                                    disabled
                                                >
                                                    鄉鎮區
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div
                                        class="booking-details-field booking-details-field--wide"
                                        data-booking-source="airport longcare charter"
                                    >
                                        <input
                                            type="text"
                                            id="origin-address"
                                            name="origin-address"
                                            placeholder="詳細地址"
                                        />
                                    </div>

                                    <!-- Airport Transfer / Long-term Care Transfer / Charter Service: destination address -->
                                    <div
                                        class="booking-details-field-group booking-details-field-group--address"
                                        data-booking-source="airport longcare charter"
                                    >
                                        <div class="booking-details-field">
                                            <label for="destination-city"
                                                >目的地</label
                                            >
                                            <select
                                                id="destination-city"
                                                name="destination-city"
                                            >
                                                <option
                                                    value=""
                                                    selected
                                                    disabled
                                                >
                                                    縣市
                                                </option>
                                            </select>
                                        </div>
                                        <div class="booking-details-field">
                                            <label
                                                for="destination-district"
                                                class="sr-only"
                                                >目的地（鄉鎮區）</label
                                            >
                                            <select
                                                id="destination-district"
                                                name="destination-district"
                                            >
                                                <option
                                                    value=""
                                                    selected
                                                    disabled
                                                >
                                                    鄉鎮區
                                                </option>
                                            </select>
                                        </div>
                                    </div>
                                    <div
                                        class="booking-details-field booking-details-field--wide"
                                        data-booking-source="airport longcare charter"
                                    >
                                        <input
                                            type="text"
                                            id="destination-address"
                                            name="destination-address"
                                            placeholder="詳細地址"
                                        />
                                    </div>
                                </div>

                                <div
                                    class="booking-details-form-grid booking-details-form-grid--notes"
                                >
                                    <div
                                        class="booking-details-field booking-details-field--wide"
                                    >
                                        <label for="notes">備註事項</label>
                                        <textarea
                                            id="notes"
                                            name="notes"
                                            placeholder="請輸入內容"
                                        ></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <aside class="booking-details-aside">
                            <div class="booking-details-summary">
                                <h2 class="booking-details-summary-title">
                                    訂單總覽
                                </h2>
                                <div class="booking-details-summary-breakdown">
                                    <div class="booking-details-summary-row">
                                        <span>行程小計</span>
                                        <span>NT$ 4,700</span>
                                    </div>
                                    <div class="booking-details-summary-row">
                                        <span>服務費</span>
                                        <span>NT$ 1,000</span>
                                    </div>
                                    <div class="booking-details-summary-row">
                                        <span>折扣</span>
                                        <span>-NT$ 10</span>
                                    </div>
                                </div>
                                <div class="booking-details-summary-total">
                                    <span>總金額</span>
                                    <span>NT$ 5,690</span>
                                </div>
                                <button
                                    type="submit"
                                    form="booking-details-form"
                                    class="btn booking-details-checkout"
                                >
                                    下一步
                                </button>
                                <p class="booking-details-summary-note">
                                    請確認填寫資訊正確。
                                </p>
                            </div>
                        </aside>
                    </div>
                </div>
            </section>
        </main>

        {{> footer }}

        <script type="module" src="/js/main.js"></script>
    </body>
</html>
