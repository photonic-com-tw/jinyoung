<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>長照服務｜金永國際租賃有限公司</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        {{> header }}

        <main class="rental-longcare">
            <section class="rental-hero">
                <img
                    class="rental-hero-media"
                    src="../assets/images/rental-longcare-hero.jpg"
                    alt=""
                    width="1448"
                    height="1086"
                />
                <div class="container rental-hero-inner">
                    <h1 class="rental-hero-title">長照服務</h1>
                    <p class="rental-hero-subtitle">
                        溫馨接送，安全舒適無障礙，貼心顧長輩。
                    </p>
                </div>
            </section>

            <section class="rental-breadcrumb">
                <div class="container">
                    <nav class="breadcrumb" aria-label="Breadcrumb">
                        <ol class="breadcrumb-list">
                            <li><a href="/pages/index.html">首頁</a></li>
                            <li>租車服務</li>
                            <li aria-current="page">長照服務</li>
                        </ol>
                    </nav>
                </div>
            </section>

            <section class="rental-cards-section">
                <div class="container">
                    <div class="rental-section-heading">
                        <h2 class="rental-section-title">長照接送車型</h2>
                        <p class="rental-section-subtitle">
                            根據您的需求，精選長照接送服務。
                        </p>
                    </div>

                    <ul class="rental-cards">
                        <li class="rental-card">
                            <a href="/pages/rental-detail.html">
                                <img
                                    src="../assets/images/rental-longcare-card.jpg"
                                    alt="長照2.0"
                                    width="2729"
                                    height="1535"
                                />
                                <div class="rental-card-body">
                                    <h3>長照2.0</h3>
                                    <p class="rental-card-desc">長照2.0</p>
                                    <p class="rental-card-suit">
                                        ・適合：行動不便年長者
                                    </p>
                                    <p class="rental-card-price">$4,700起</p>
                                </div>
                            </a>
                        </li>
                        <li class="rental-card">
                            <a href="/pages/rental-detail.html">
                                <img
                                    src="../assets/images/rental-longcare-card.jpg"
                                    alt="長照2.0"
                                    width="2729"
                                    height="1535"
                                />
                                <div class="rental-card-body">
                                    <h3>長照2.0</h3>
                                    <p class="rental-card-desc">長照2.0</p>
                                    <p class="rental-card-suit">
                                        ・適合：行動不便年長者
                                    </p>
                                    <p class="rental-card-price">$4,700起</p>
                                </div>
                            </a>
                        </li>
                    </ul>
                </div>
            </section>
        </main>

        {{> footer }}

        <script type="module" src="/js/main.js"></script>
    </body>
</html>
